<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Riding gear for rent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Hanken+Grotesk:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--tarmac:#1b1e23;--ink:#0e1013;--lane:#f2f0ea;--concrete:#d8d4ca;--hivis:#ffd60a;--muted:#8b8f96}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{margin:0;font-family:'Hanken Grotesk',Arial,sans-serif;background:var(--lane);color:var(--ink);line-height:1.5}
h1,h2,h3{font-family:'Big Shoulders Display',Impact,sans-serif;margin:0;line-height:.9;font-weight:900}
a{color:inherit}
:focus-visible{outline:3px solid var(--hivis);outline-offset:3px}

/* nav */
.nav{position:sticky;top:0;z-index:10;background:var(--tarmac);color:var(--lane);display:flex;align-items:center;gap:24px;padding:0 clamp(16px,4vw,56px);min-height:64px;overflow-x:auto;white-space:nowrap}
.brand{font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:26px;text-decoration:none;margin-right:auto}
.nav a.pill{text-decoration:none;font-weight:600;padding:10px 4px;border-bottom:3px solid transparent}
.nav a.pill:hover{border-color:var(--hivis)}
.call{background:var(--hivis);color:var(--ink);text-decoration:none;font-weight:600;padding:11px 18px;border-radius:999px}

/* hero */
.hero{background:var(--tarmac);color:var(--lane);position:relative;overflow:hidden;padding:clamp(40px,7vw,96px) clamp(16px,4vw,56px) 120px;display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center;min-height:82vh}
.hero h1{font-size:clamp(72px,12.5vw,200px);letter-spacing:-.01em;animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
.hero h1 span{display:block;-webkit-text-stroke:2px var(--lane);color:transparent}
.hero p{max-width:440px;font-size:19px;color:#c8cbd0;margin:28px 0 32px}
.btn{display:inline-block;background:var(--hivis);color:var(--ink);font-weight:600;text-decoration:none;padding:16px 28px;border-radius:999px;font-size:17px}
.frame{aspect-ratio:4/5;background:#2a2e35 center/cover;transform:rotate(3deg);border:10px solid var(--lane);box-shadow:16px 16px 0 var(--hivis);display:flex;align-items:center;justify-content:center;color:var(--muted);text-align:center;padding:20px}
.road{position:absolute;left:0;right:0;bottom:44px;height:6px;background:repeating-linear-gradient(90deg,var(--hivis) 0 56px,transparent 56px 104px)}
@keyframes rise{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}

/* catalog */
.cat{padding:clamp(48px,7vw,96px) 0 8px}
.cat-head{display:flex;align-items:baseline;gap:20px;padding:0 clamp(16px,4vw,56px);margin-bottom:28px;flex-wrap:wrap}
.cat-head h2{font-size:clamp(56px,8vw,120px)}
.cat-head p{margin:0;color:#4a4e55;max-width:360px}
.count{font-weight:600;background:var(--ink);color:var(--lane);border-radius:999px;padding:4px 12px;font-size:14px}
.row{display:flex;gap:20px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 clamp(16px,4vw,56px) 28px}
.card{flex:0 0 clamp(240px,26vw,340px);scroll-snap-align:start;margin:0}
.pic{position:relative;aspect-ratio:4/5;background:var(--concrete);overflow:hidden;cursor:pointer;border:0;padding:0;width:100%;display:block}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .35s}
.pic img.alt{opacity:0}
.pic:hover img.alt,.pic.on img.alt{opacity:1}
.ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#7d7a72;font-size:14px;background:repeating-linear-gradient(135deg,#dedad0 0 14px,#d4d0c5 14px 28px)}
.card h3{font-size:28px;margin:14px 0 4px;text-transform:capitalize}
.card .rate{color:#4a4e55;font-size:15px}
.empty{padding:0 clamp(16px,4vw,56px) 28px;color:#4a4e55}
.dash{height:6px;margin:32px 0 0;background:repeating-linear-gradient(90deg,var(--tarmac) 0 56px,transparent 56px 104px);opacity:.18}

/* contact */
.contact{background:var(--hivis);padding:clamp(48px,7vw,96px) clamp(16px,4vw,56px);display:flex;flex-wrap:wrap;gap:32px;justify-content:space-between;align-items:end}
.contact h2{font-size:clamp(56px,9vw,140px)}
.contact a.big{font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:clamp(36px,5vw,72px);text-decoration:none;display:block}
.contact p{margin:8px 0 0;font-weight:600}

@media(max-width:820px){.hero{grid-template-columns:1fr;min-height:0}.frame{max-width:340px;transform:rotate(2deg)}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.hero h1{animation:none}.pic img{transition:none}}
</style>
</head>
<body>

<nav class="nav" id="nav" aria-label="Categories"><a class="brand" href="#top" id="brand"></a><a class="call" id="callTop" href="#contact">Call us</a></nav>

<header class="hero" id="top">
  <div>
    <h1>Ride in <span>proper gear.</span></h1>
    <p>Jackets, pants, shoes, gloves and accessories to rent. Browse what we have, then call to book.</p>
    <a class="btn" href="#catalog">View the collection</a>
  </div>
  <div class="frame" id="heroImg" role="img" aria-label="Featured riding jacket">Your first jacket photo shows here</div>
  <div class="road" aria-hidden="true"></div>
</header>

<main id="catalog"></main>

<section class="contact" id="contact">
  <h2>Want to rent?<br>Give us a call.</h2>
  <div><a class="big" id="phone" href="#"></a><p id="where"></p></div>
</section>

<script>
/* ============ EDIT THIS PART ============ */
const CONFIG = {
  brand: "7th Gear",
  phone: "+91 00000 00000",
  location: "Pickup: your address here",

  // Your GitHub repo that holds the photos (leave github empty to see demo placeholders)
  github: "Nag685",
  repo: "7th-gear-rental",
  branch: "main",

  // Folder that holds all the photos, relative to this index.html
  imageBase: "7thgear/",

  // Tell the site which photo is which. One line per product:
  // photos = [front photo, second photo (optional, shows on hover)]
  products: [
    // { cat: "jackets", name: "Black riding jacket", photos: ["1000028442.jpg", "1000028443.jpg"] },
    // { cat: "gloves",  name: "Leather gloves",      photos: ["1000028450.jpg"] },
  ],

  // Sections on the page (cat above must match a folder name here)
  categories: [
    { folder: "jackets",     title: "Jackets",     blurb: "Riding jackets for every season.", rate: "" },
    { folder: "pants",       title: "Pants",       blurb: "Protective riding pants.",         rate: "" },
    { folder: "shoes",       title: "Shoes",       blurb: "Riding shoes and boots.",          rate: "" },
    { folder: "gloves",      title: "Gloves",      blurb: "Gloves for grip and protection.",  rate: "" },
    { folder: "accessories", title: "Accessories", blurb: "The extras to finish the kit.",    rate: "" }
  ]
};
/* ======================================== */

const $ = (s, el = document) => el.querySelector(s);
const IMG = /\.(jpe?g|png|webp|gif|avif)$/i;
const OPEN = /[-_ ]?(zip[-_ ]?)?(open|opened)$/i;
const CLOSED = /[-_ ]?(zip[-_ ]?)?(closed|close)$/i;

// Photos named  black-jacket-closed.jpg  and  black-jacket-open.jpg  become one product.
function group(files) {
  const map = new Map();
  files.filter(f => IMG.test(f.name)).sort((a, b) => a.name.localeCompare(b.name)).forEach(f => {
    const base = f.name.replace(IMG, "");
    const isOpen = OPEN.test(base);
    const key = base.replace(OPEN, "").replace(CLOSED, "");
    const p = map.get(key) || { name: key.replace(/[-_]+/g, " ").trim() };
    if (isOpen) p.alt = f.url; else p.main = p.main || f.url;
    map.set(key, p);
  });
  return [...map.values()].map(p => ({ ...p, main: p.main || p.alt, alt: p.main ? p.alt : null }));
}

async function load(c) {
  if (CONFIG.products.length) {
    return CONFIG.products.filter(p => p.cat === c.folder).map(p => ({
      name: p.name, main: CONFIG.imageBase + p.photos[0], alt: p.photos[1] ? CONFIG.imageBase + p.photos[1] : null
    }));
  }
  if (!CONFIG.github || !CONFIG.repo) {
    return Array.from({ length: 4 }, (_, i) => ({ name: c.title.toLowerCase() + " " + (i + 1) }));
  }
  const url = `https://api.github.com/repos/${CONFIG.github}/${CONFIG.repo}/contents/${c.folder}?ref=${CONFIG.branch}`;
  const ck = "gear:" + url;
  try {
    let data = JSON.parse(sessionStorage.getItem(ck) || "null");
    if (!data) {
      const r = await fetch(url);
      if (!r.ok) throw 0;
      data = (await r.json()).map(f => ({ name: f.name, url: f.download_url }));
      try { sessionStorage.setItem(ck, JSON.stringify(data)); } catch (e) {}
    }
    return group(data);
  } catch (e) { return null; }
}

function card(p, c) {
  const el = document.createElement("figure");
  el.className = "card";
  const pic = document.createElement("button");
  pic.className = "pic"; pic.type = "button";
  pic.setAttribute("aria-label", p.name + (p.alt ? ": show other view" : ""));
  if (p.main) {
    pic.innerHTML = `<img src="${p.main}" alt="${p.name}" loading="lazy">` + (p.alt ? `<img class="alt" src="${p.alt}" alt="" loading="lazy">` : "");
    if (p.alt) pic.addEventListener("click", () => pic.classList.toggle("on"));
  } else pic.innerHTML = `<div class="ph">Photo</div>`;
  el.append(pic);
  el.insertAdjacentHTML("beforeend", `<h3>${p.name}</h3>` + (c.rate ? `<div class="rate">${c.rate}</div>` : ""));
  return el;
}

async function init() {
  $("#brand").textContent = CONFIG.brand;
  $("#phone").textContent = CONFIG.phone;
  $("#phone").href = "tel:" + CONFIG.phone.replace(/[^+\d]/g, "");
  $("#callTop").href = $("#phone").href;
  $("#where").textContent = CONFIG.location;
  document.title = CONFIG.brand + " | Riding gear for rent";

  const nav = $("#nav"), main = $("#catalog");
  CONFIG.categories.forEach(c => nav.insertBefore(Object.assign(document.createElement("a"), { className: "pill", href: "#" + c.folder, textContent: c.title }), $("#callTop")));

  let heroSet = false;
  for (const c of CONFIG.categories) {
    const sec = document.createElement("section");
    sec.className = "cat"; sec.id = c.folder;
    sec.innerHTML = `<div class="cat-head"><h2>${c.title}</h2><span class="count" hidden></span><p>${c.blurb}</p></div>`;
    main.append(sec);
    const items = await load(c);
    if (!items || !items.length) {
      sec.insertAdjacentHTML("beforeend", `<p class="empty">${items ? `Photos coming soon. Add images to the "${c.folder}" folder.` : `Could not load the "${c.folder}" folder. Check the repo name in CONFIG.`}</p>`);
    } else {
      const row = document.createElement("div"); row.className = "row";
      items.forEach(p => row.append(card(p, c)));
      sec.append(row);
      const n = $(".count", sec); n.hidden = false; n.textContent = items.length + (items.length === 1 ? " item" : " items");
      if (!heroSet && items[0].main) { const h = $("#heroImg"); h.style.backgroundImage = `url("${items[0].main}")`; h.textContent = ""; heroSet = true; }
    }
    sec.insertAdjacentHTML("beforeend", `<div class="dash" aria-hidden="true"></div>`);
  }
}
init();
</script>
</body>
</html>
