<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Riding gear for rent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Hanken+Grotesk:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--tarmac:#1b1e23;--ink:#0e1013;--lane:#f2f0ea;--concrete:#d8d4ca;--hivis:#ffd60a;--muted:#8b8f96}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{margin:0;font-family:'Hanken Grotesk',Arial,sans-serif;background:var(--lane);color:var(--ink);line-height:1.5}
h1,h2,h3{font-family:'Big Shoulders Display',Impact,sans-serif;margin:0;line-height:.9;font-weight:900}
a{color:inherit}
:focus-visible{outline:3px solid var(--hivis);outline-offset:3px}

/* nav */
.nav{position:sticky;top:0;z-index:10;background:var(--tarmac);color:var(--lane);display:flex;align-items:center;gap:24px;padding:0 clamp(16px,4vw,56px);min-height:56px;overflow-x:auto;white-space:nowrap}
.brand{font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:24px;text-decoration:none;margin-right:auto}
.nav a.pill{text-decoration:none;font-weight:600;padding:10px 4px;border-bottom:3px solid transparent}
.nav a.pill:hover{border-color:var(--hivis)}
.call{background:var(--hivis);color:var(--ink);text-decoration:none;font-weight:600;padding:11px 18px;border-radius:999px}

/* hero */
.hero{background:var(--tarmac);color:var(--lane);position:relative;overflow:hidden;padding:clamp(32px,4vw,56px) clamp(16px,4vw,56px) 72px;display:grid;grid-template-columns:1.3fr .7fr;gap:32px;align-items:center}
.hero h1{font-size:clamp(44px,6.5vw,92px);letter-spacing:-.01em;animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
.hero h1 span{display:block;-webkit-text-stroke:1.5px var(--lane);color:transparent}
.hero p{max-width:420px;font-size:17px;color:#c8cbd0;margin:20px 0 24px}
.btn{display:inline-block;background:var(--hivis);color:var(--ink);font-weight:600;text-decoration:none;padding:13px 24px;border-radius:999px;font-size:16px}
.frame{aspect-ratio:4/5;background:#2a2e35 center/cover;transform:rotate(3deg);border:6px solid var(--lane);box-shadow:10px 10px 0 var(--hivis);display:flex;align-items:center;justify-content:center;color:var(--muted);text-align:center;padding:20px}
.road{position:absolute;left:0;right:0;bottom:28px;height:4px;background:repeating-linear-gradient(90deg,var(--hivis) 0 56px,transparent 56px 104px)}
@keyframes rise{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}

/* catalog */
.cat{padding:clamp(32px,4vw,48px) 0 4px}
.cat-head{display:flex;align-items:baseline;gap:20px;padding:0 clamp(16px,4vw,56px);margin-bottom:18px;flex-wrap:wrap}
.cat-head h2{font-size:clamp(36px,4.5vw,56px)}
.cat-head p{margin:0;color:#4a4e55;max-width:360px}
.count{font-weight:600;background:var(--ink);color:var(--lane);border-radius:999px;padding:4px 12px;font-size:14px}
.row{display:flex;gap:20px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 clamp(16px,4vw,56px) 28px}
.card{flex:0 0 clamp(190px,19vw,240px);scroll-snap-align:start;margin:0}
.pic{position:relative;aspect-ratio:4/5;background:var(--concrete);overflow:hidden;cursor:pointer;border:0;padding:0;width:100%;display:block}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .35s}
.pic img.alt{opacity:0}
.pic:hover img.alt,.pic.on img.alt{opacity:1}
.ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#7d7a72;font-size:14px;background:repeating-linear-gradient(135deg,#dedad0 0 14px,#d4d0c5 14px 28px)}
.card h3{font-size:22px;margin:10px 0 2px;text-transform:capitalize}
.card .rate{color:#4a4e55;font-size:15px}
.empty{padding:0 clamp(16px,4vw,56px) 28px;color:#4a4e55}
.dash{height:4px;margin:20px 0 0;background:repeating-linear-gradient(90deg,var(--tarmac) 0 56px,transparent 56px 104px);opacity:.18}

/* photo viewer */
.lb{position:fixed;inset:0;z-index:50;background:rgba(14,16,19,.93);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
.lb.open{display:flex}
.lb h3{color:var(--lane);font-size:28px;text-transform:capitalize;text-align:center}
.lb img{max-width:min(94vw,900px);max-height:74vh;object-fit:contain;background:#fff}
.lb .bar{display:flex;gap:12px}
.lb button{min-height:44px;padding:0 22px;border-radius:999px;border:0;font-weight:600;font-size:16px;background:var(--hivis);color:var(--ink);cursor:pointer}

/* contact */
.contact{background:var(--hivis);padding:clamp(32px,4vw,56px) clamp(16px,4vw,56px);display:flex;flex-wrap:wrap;gap:24px;justify-content:space-between;align-items:end}
.contact h2{font-size:clamp(36px,5vw,64px)}
.contact a.big{font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:clamp(28px,3.5vw,44px);text-decoration:none;display:block}
.contact p{margin:8px 0 0;font-weight:600}

@media(max-width:820px){.hero{grid-template-columns:1fr;min-height:0}.frame{max-width:260px;transform:rotate(2deg)}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.hero h1{animation:none}.pic img{transition:none}}
</style>
</head>
<body>

<nav class="nav" id="nav" aria-label="Categories"><a class="brand" href="#top" id="brand"></a><a class="call" id="callTop" href="#contact">Call us</a></nav>

<header class="hero" id="top">
  <div>
    <h1>Ride in <span>proper gear.</span></h1>
    <p>Jackets, pants, shoes, gloves and accessories to rent. Browse what we have, then call to book.</p>
    <a class="btn" href="#catalog">View the collection</a>
  </div>
  <div class="frame" id="heroImg" role="img" aria-label="Featured riding jacket">Your first jacket photo shows here</div>
  <div class="road" aria-hidden="true"></div>
</header>

<main id="catalog"></main>

<section class="contact" id="contact">
  <h2>Want to rent?<br>Give us a call.</h2>
  <div><a class="big" id="phone" href="#"></a><p id="where"></p></div>
</section>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <h3 id="lbName"></h3><img id="lbImg" alt="">
  <div class="bar"><button id="lbOther" type="button">Other view</button><button id="lbClose" type="button">Close</button></div>
</div>

<script>
/* ============ EDIT THIS PART ============ */
const CONFIG = {
  brand: "7th Gear",
  phone: "+91 00000 00000",      // <- put your friend's phone number
  location: "Pickup: your address here",   // <- put the pickup address

  imageBase: "7thgear/",   // folder with all photos, next to this index.html

  // One line per product. photos = [front photo, optional second photo (shows on hover or tap)]
  products: [
    { cat: "jackets", name: "Rynox mesh jacket, grey and black", photos: ["1000028472.jpg"] },
    { cat: "jackets", name: "Rynox jacket, black and white", photos: ["1000028476.jpg"] },
    { cat: "jackets", name: "Honda Rynox jacket, black and red", photos: ["1000028486.jpg"] },
    { cat: "jackets", name: "Rynox mesh jacket, grey and neon", photos: ["1000028482.jpg"] },
    { cat: "jackets", name: "Rynox mesh jacket, black and white", photos: ["1000028491.jpg"] },
    { cat: "jackets", name: "Mesh jacket, black and grey", photos: ["1000028498.jpg"] },
    { cat: "jackets", name: "Rynox jacket, black and neon", photos: ["1000028506.jpg"] },
    { cat: "jackets", name: "Rynox jacket, black and orange", photos: ["1000028501.jpg"] },
    { cat: "pants", name: "Mesh riding pants, black", photos: ["1000028457.jpg"] },
    { cat: "pants", name: "Rynox pants, grey stripe", photos: ["1000028462.jpg"] },
    { cat: "pants", name: "Rynox mesh cargo pants", photos: ["1000028466.jpg"] },
    { cat: "pants", name: "Rynox Advento Pro pants", photos: ["1000028471.jpg"] },
    { cat: "pants", name: "Viaterra pants, black", photos: ["1000028496.jpg"] },
    { cat: "pants", name: "Riding pants, black and orange", photos: ["1000028463.jpg"] },
    { cat: "shoes", name: "Raida boots, grey", photos: ["1000028517.jpg"] },
    { cat: "shoes", name: "Gadsyll lace-up boots, brown", photos: ["1000028520.jpg"] },
    { cat: "shoes", name: "Gadsyll boots, brown", photos: ["1000028518.jpg"] },
    { cat: "shoes", name: "Gadsyll boots, black", photos: ["1000028522.jpg"] },
    { cat: "gloves", name: "Viaterra gloves, black and neon", photos: ["1000028510.jpg"] },
    { cat: "gloves", name: "Rynox Advento Pro gloves, black", photos: ["1000028508.jpg"] },
    { cat: "gloves", name: "Rynox carbon gloves, black", photos: ["1000028512.jpg"] },
    { cat: "gloves", name: "Tarmac gloves, black", photos: ["1000028514.jpg"] },
    { cat: "gloves", name: "Rynox gloves, black and red", photos: ["1000028511.jpg"] },
    { cat: "gloves", name: "Rynox short gloves, grey and green", photos: ["1000028507.jpg"] },
    { cat: "gloves", name: "Rynox gloves, black and neon", photos: ["1000028509.jpg"] },
    { cat: "gloves", name: "Cramster gloves, black and white", photos: ["1000028515.jpg"] },
    { cat: "gloves", name: "Rynox gloves, black and tan", photos: ["1000028513.jpg"] },
    { cat: "accessories", name: "Lenskart Boost polarized sunglasses", photos: ["1000028525.jpg"] },
    { cat: "helmets", name: "Blue snake-graphic helmet", photos: ["1000028447.jpg", "1000028442.jpg"] },
    { cat: "helmets", name: "Axor helmet, grey and neon", photos: ["1000028451.jpg", "1000028452.jpg"] },
    { cat: "helmets", name: "LS2 helmet, white, red and blue", photos: ["1000028453.jpg", "1000028455.jpg"] },
  ],

  // Sections on the page (cat above must match a folder name here). fit: "cover" fills the card, "contain" shows the whole photo.
  categories: [
    { folder: "jackets", title: "Jackets", blurb: "Riding jackets for every season.", rate: "", fit: "cover" },
    { folder: "pants",   title: "Pants",   blurb: "Protective riding pants.",         rate: "", fit: "cover" },
    { folder: "shoes",   title: "Shoes",   blurb: "Riding boots.",                    rate: "", fit: "contain" },
    { folder: "gloves",  title: "Gloves",  blurb: "Gloves for grip and protection.",  rate: "", fit: "cover" },
    { folder: "helmets", title: "Helmets", blurb: "Full-face helmets.",               rate: "", fit: "contain" },
    { folder: "accessories", title: "Accessories", blurb: "The extras to finish the kit.", rate: "", fit: "contain" }
  ]
};
/* ======================================== */

const $ = (s, el = document) => el.querySelector(s);
const IMG = /\.(jpe?g|png|webp|gif|avif)$/i;
const OPEN = /[-_ ]?(zip[-_ ]?)?(open|opened)$/i;
const CLOSED = /[-_ ]?(zip[-_ ]?)?(closed|close)$/i;

// Photos named  black-jacket-closed.jpg  and  black-jacket-open.jpg  become one product.
function group(files) {
  const map = new Map();
  files.filter(f => IMG.test(f.name)).sort((a, b) => a.name.localeCompare(b.name)).forEach(f => {
    const base = f.name.replace(IMG, "");
    const isOpen = OPEN.test(base);
    const key = base.replace(OPEN, "").replace(CLOSED, "");
    const p = map.get(key) || { name: key.replace(/[-_]+/g, " ").trim() };
    if (isOpen) p.alt = f.url; else p.main = p.main || f.url;
    map.set(key, p);
  });
  return [...map.values()].map(p => ({ ...p, main: p.main || p.alt, alt: p.main ? p.alt : null }));
}

async function load(c) {
  if (CONFIG.products.length) {
    return CONFIG.products.filter(p => p.cat === c.folder).map(p => ({
      name: p.name, main: CONFIG.imageBase + p.photos[0], alt: p.photos[1] ? CONFIG.imageBase + p.photos[1] : null
    }));
  }
  if (!CONFIG.github || !CONFIG.repo) {
    return Array.from({ length: 4 }, (_, i) => ({ name: c.title.toLowerCase() + " " + (i + 1) }));
  }
  const url = `https://api.github.com/repos/${CONFIG.github}/${CONFIG.repo}/contents/${c.folder}?ref=${CONFIG.branch}`;
  const ck = "gear:" + url;
  try {
    let data = JSON.parse(sessionStorage.getItem(ck) || "null");
    if (!data) {
      const r = await fetch(url);
      if (!r.ok) throw 0;
      data = (await r.json()).map(f => ({ name: f.name, url: f.download_url }));
      try { sessionStorage.setItem(ck, JSON.stringify(data)); } catch (e) {}
    }
    return group(data);
  } catch (e) { return null; }
}

let lbPics = [], lbI = 0;
function openLB(p) {
  lbPics = [p.main, p.alt].filter(Boolean); lbI = 0;
  $("#lbName").textContent = p.name;
  $("#lbImg").src = lbPics[0]; $("#lbImg").alt = p.name;
  $("#lbOther").hidden = lbPics.length < 2;
  $("#lb").classList.add("open"); $("#lbClose").focus();
}
const closeLB = () => $("#lb").classList.remove("open");
$("#lbClose").addEventListener("click", closeLB);
$("#lb").addEventListener("click", e => { if (e.target.id === "lb") closeLB(); });
$("#lbOther").addEventListener("click", () => { lbI = (lbI + 1) % lbPics.length; $("#lbImg").src = lbPics[lbI]; });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeLB(); });

function card(p, c) {
  const el = document.createElement("figure");
  el.className = "card";
  const pic = document.createElement("button");
  pic.className = "pic"; pic.type = "button";
  pic.setAttribute("aria-label", p.name + ": view larger");
  if (p.main) {
    const fit = `style="object-fit:${c.fit || "cover"}"`;
    pic.innerHTML = `<img src="${p.main}" alt="${p.name}" loading="lazy" ${fit}>` + (p.alt ? `<img class="alt" src="${p.alt}" alt="" loading="lazy" ${fit}>` : "");
    pic.addEventListener("click", () => { if (pic.querySelector("img")) openLB(p); });
    pic.querySelectorAll("img").forEach(img => img.addEventListener("error", () => {
      if (!img.dataset.retry) {            // try .JPG / .jpg once
        img.dataset.retry = "1";
        img.src = img.src.replace(/\.(jpg|JPG)$/, (m, e) => e === "jpg" ? ".JPG" : ".jpg");
        return;
      }
      if (img.classList.contains("alt")) { img.remove(); return; }
      const file = decodeURIComponent(img.src.split("/").pop());
      pic.innerHTML = `<div class="ph">Photo missing:<br>${file}</div>`;
    }));
  } else pic.innerHTML = `<div class="ph">Photo</div>`;
  el.append(pic);
  el.insertAdjacentHTML("beforeend", `<h3>${p.name}</h3>` + (c.rate ? `<div class="rate">${c.rate}</div>` : ""));
  return el;
}

async function init() {
  $("#brand").textContent = CONFIG.brand;
  $("#phone").textContent = CONFIG.phone;
  $("#phone").href = "tel:" + CONFIG.phone.replace(/[^+\d]/g, "");
  $("#callTop").href = $("#phone").href;
  $("#where").textContent = CONFIG.location;
  document.title = CONFIG.brand + " | Riding gear for rent";

  const nav = $("#nav"), main = $("#catalog");
  CONFIG.categories.forEach(c => nav.insertBefore(Object.assign(document.createElement("a"), { className: "pill", href: "#" + c.folder, textContent: c.title }), $("#callTop")));

  let heroSet = false;
  for (const c of CONFIG.categories) {
    const sec = document.createElement("section");
    sec.className = "cat"; sec.id = c.folder;
    sec.innerHTML = `<div class="cat-head"><h2>${c.title}</h2><span class="count" hidden></span><p>${c.blurb}</p></div>`;
    main.append(sec);
    const items = await load(c);
    if (!items || !items.length) {
      sec.insertAdjacentHTML("beforeend", `<p class="empty">${items ? `Photos coming soon. Add images to the "${c.folder}" folder.` : `Could not load the "${c.folder}" folder. Check the repo name in CONFIG.`}</p>`);
    } else {
      const row = document.createElement("div"); row.className = "row";
      items.forEach(p => row.append(card(p, c)));
      sec.append(row);
      const n = $(".count", sec); n.hidden = false; n.textContent = items.length + (items.length === 1 ? " item" : " items");
      if (!heroSet && items[0].main) { const h = $("#heroImg"); h.style.backgroundImage = `url("${items[0].main}")`; h.textContent = ""; heroSet = true; }
    }
    sec.insertAdjacentHTML("beforeend", `<div class="dash" aria-hidden="true"></div>`);
  }
}
init();
</script>
</body>
</html>
